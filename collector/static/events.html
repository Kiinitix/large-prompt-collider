<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Large Prompt Collider - Events</title>
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
  margin: 20px;
  color: #222;
  background: #fff;
}
h1 {
  font-size: 18px;
  margin-bottom: 4px;
}
p.desc {
  color: #555;
  margin-top: 0;
}
.top-link {
  font-size: 13px;
  margin-bottom: 14px;
}
.controls {
  border: 1px solid #ccc;
  padding: 10px;
  margin-bottom: 14px;
}
.controls label {
  font-size: 12px;
  margin-right: 4px;
}
.controls select, .controls input {
  font-size: 13px;
  padding: 3px;
  margin-right: 14px;
}
.controls button {
  padding: 4px 12px;
  font-size: 13px;
}
table {
  border-collapse: collapse;
  width: 100%;
}
th, td {
  border: 1px solid #ccc;
  padding: 5px 7px;
  text-align: left;
  font-size: 12px;
  vertical-align: top;
}
th {
  background: #eee;
}
tr.request-row {
  color: #666;
}
tr.error-row {
  background: #fff0f0;
}
tr.clickable:hover {
  background: #f5f5f5;
  cursor: pointer;
}
.badge {
  display: inline-block;
  padding: 1px 6px;
  border: 1px solid #999;
  font-size: 11px;
}
.badge.error {
  border-color: #b00000;
  color: #b00000;
}
.badge.ok {
  border-color: #006000;
  color: #006000;
}
#detailBox {
  margin-top: 16px;
  border: 1px solid #ccc;
  padding: 10px;
  display: none;
}
#detailBox h2 {
  font-size: 14px;
  margin-top: 0;
}
pre {
  background: #f5f5f5;
  border: 1px solid #ddd;
  padding: 10px;
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-word;
}
.small {
  font-size: 12px;
  color: #555;
}
</style>
</head>
<body>

<div class="top-link"><a href="/dashboard">back to dashboard</a> | <a href="/demo">send test request</a></div>

<h1>Events</h1>
<p class="desc">Raw request/response events captured from the tracking proxies.</p>

<div class="controls">
  <label for="deviceFilter">Device</label>
  <select id="deviceFilter">
    <option value="">all</option>
  </select>

  <label for="limitInput">Limit</label>
  <input type="text" id="limitInput" value="50" size="4">

  <label for="autoRefresh"><input type="checkbox" id="autoRefresh" style="width:auto;"> auto refresh</label>

  <button id="refreshBtn">Refresh</button>

  <span class="small" id="countLabel"></span>
</div>

<table id="eventsTable">
  <thead>
    <tr>
      <th>Time</th>
      <th>Device</th>
      <th>Direction</th>
      <th>Model</th>
      <th>Status</th>
      <th>Latency</th>
      <th>Tokens</th>
      <th>Cost</th>
      <th>Correlation</th>
    </tr>
  </thead>
  <tbody id="eventsBody">
    <tr><td colspan="9">loading...</td></tr>
  </tbody>
</table>

<div id="detailBox">
  <h2>Trace detail</h2>
  <div id="detailMeta" class="small"></div>
  <p class="small"><strong>Request</strong></p>
  <pre id="detailRequest"></pre>
  <p class="small"><strong>Response</strong></p>
  <pre id="detailResponse"></pre>
</div>

<script>
var apiKey = new URLSearchParams(location.search).get('api_key') || '';
var headers = apiKey ? { 'X-API-Key': apiKey } : {};
var autoTimer = null;
var knownDevices = {};

function fmtTime(ts) {
  if (!ts) return '-';
  return ts.replace('T', ' ').replace(/\.\d+.*/, '');
}

function loadDeviceOptions(events) {
  var sel = document.getElementById('deviceFilter');
  var current = sel.value;
  var changed = false;
  events.forEach(function(e) {
    if (e.device_id && !knownDevices[e.device_id]) {
      knownDevices[e.device_id] = true;
      changed = true;
    }
  });
  if (changed) {
    var names = Object.keys(knownDevices).sort();
    sel.innerHTML = '<option value="">all</option>' +
      names.map(function(d) { return '<option value="' + d + '">' + d + '</option>'; }).join('');
    sel.value = current;
  }
}

function loadEvents() {
  var device = document.getElementById('deviceFilter').value;
  var limit = document.getElementById('limitInput').value || '50';
  var url = '/events?limit=' + encodeURIComponent(limit) + (device ? '&device_id=' + encodeURIComponent(device) : '');

  fetch(url, { headers: headers })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var events = data.events || [];
      document.getElementById('countLabel').textContent = events.length + ' events';
      loadDeviceOptions(events);

      var body = document.getElementById('eventsBody');
      if (events.length === 0) {
        body.innerHTML = '<tr><td colspan="9">no events yet</td></tr>';
        return;
      }

      body.innerHTML = events.map(function(e) {
        var isResponse = e.direction === 'response';
        var isError = isResponse && (e.error || (e.status_code && e.status_code >= 400));
        var rowClass = (isError ? 'error-row ' : (isResponse ? '' : 'request-row ')) + 'clickable';

        var statusCell = '-';
        if (isResponse) {
          var badgeClass = isError ? 'badge error' : 'badge ok';
          statusCell = '<span class="' + badgeClass + '">' + (e.status_code != null ? e.status_code : 'error') + '</span>';
        }

        return '<tr class="' + rowClass + '" data-correlation="' + e.correlation_id + '">' +
          '<td>' + fmtTime(e.timestamp) + '</td>' +
          '<td>' + (e.device_id || '-') + '</td>' +
          '<td>' + (e.direction || '-') + '</td>' +
          '<td>' + (e.model || '-') + '</td>' +
          '<td>' + statusCell + '</td>' +
          '<td>' + (e.latency_ms != null ? Math.round(e.latency_ms) + 'ms' : '-') + '</td>' +
          '<td>' + (e.total_tokens != null ? e.total_tokens : '-') + '</td>' +
          '<td>' + (e.estimated_cost_usd != null ? '$' + e.estimated_cost_usd.toFixed(4) : '-') + '</td>' +
          '<td>' + (e.correlation_id ? e.correlation_id.slice(0, 8) : '-') + '</td>' +
          '</tr>';
      }).join('');

      var rows = body.querySelectorAll('tr.clickable');
      rows.forEach(function(row) {
        row.addEventListener('click', function() {
          showTrace(row.getAttribute('data-correlation'));
        });
      });
    });
}

function showTrace(correlationId) {
  fetch('/traces/' + encodeURIComponent(correlationId), { headers: headers })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var box = document.getElementById('detailBox');
      var meta = document.getElementById('detailMeta');
      meta.textContent = 'Correlation ID: ' + correlationId +
        '  |  complete: ' + data.complete +
        (data.estimated_cost_usd != null ? '  |  estimated cost: $' + data.estimated_cost_usd.toFixed(4) : '');
      document.getElementById('detailRequest').textContent = data.request ? JSON.stringify(data.request, null, 2) : '(no request event)';
      document.getElementById('detailResponse').textContent = data.response ? JSON.stringify(data.response, null, 2) : '(no response event)';
      box.style.display = 'block';
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
}

document.getElementById('refreshBtn').addEventListener('click', loadEvents);
document.getElementById('deviceFilter').addEventListener('change', loadEvents);

document.getElementById('autoRefresh').addEventListener('change', function() {
  if (this.checked) {
    autoTimer = setInterval(loadEvents, 5000);
  } else {
    clearInterval(autoTimer);
  }
});

loadEvents();
if (apiKey) {
  var navLinks = document.querySelectorAll('.top-link a');
  navLinks.forEach(function(a) {
    a.href = a.getAttribute('href') + '?api_key=' + apiKey;
  });
}
</script>

</body>
</html>
