listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# --- Auth / TLS -----------------------------------------------------------
# The config above is intentionally wide open -- fine for a closed test
# network (this repo's default docker-compose setup), NOT fine for
# anything reachable beyond that. To lock it down:
#
#   1. Username/password auth: see mosquitto.auth.conf.example in this same
#      directory for a ready-to-copy config, and mosquitto/gen-passwd.sh to
#      create the password file. Then set MQTT_USERNAME / MQTT_PASSWORD on
#      the proxy and collector containers.
#
#   2. TLS: see mosquitto.tls.conf.example, and mosquitto/gen-certs.sh to
#      generate a self-signed CA + broker cert for testing (use a real CA
#      in production). Then set MQTT_USE_TLS=true and MQTT_CA_CERT on the
#      proxy and collector containers, pointed at the CA cert.
#
# Both can be combined (auth + TLS) by merging the two example configs.

